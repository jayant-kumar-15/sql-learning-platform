<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SQL Tutorials | SQL Learning Platform</title>

    <!-- Shared platform styling. -->
    <link rel="stylesheet" href="../styles/main.css">

    <!-- Tutorial-specific styling only. -->
    <link rel="stylesheet" href="tutorial.css?v=2">
</head>

<body>

    <!-- ============================================================
         PLATFORM HEADER
         ------------------------------------------------------------
         This header intentionally mirrors the Home page branding.

         The logo is a normal browser-side navigation link:
             frontend/tutorial/tutorial.html
                         ↓
             frontend/home/home.html

         No backend/API call is involved.
         ============================================================ -->
    <header class="tutorial-site-header">

        <!--
            Clickable platform brand.
            Keeping the destination relative makes the link work
            correctly when the site is hosted from GitHub Pages.
        -->
        <a
            class="tutorial-brand"
            href="../home/home.html"
            aria-label="SQL Learning Platform home">

            <span class="tutorial-brand-mark" aria-hidden="true">SQL</span>

            <span class="tutorial-brand-text">
                <strong>SQL Learning</strong>
                <small>Platform</small>
            </span>
        </a>

        <!-- Mobile-only hamburger. Desktop keeps the normal inline navigation. -->
        <button
            id="tutorial-mobile-menu-button"
            class="tutorial-mobile-menu-button"
            type="button"
            aria-label="Open navigation"
            aria-expanded="false">
            ☰
        </button>

        <nav
            id="tutorial-main-navigation"
            class="tutorial-main-navigation"
            aria-label="Main navigation">

            <!-- Paths are relative to frontend/tutorial/tutorial.html. -->
            <a href="../home/home.html">Home</a>
            <a href="tutorial.html" aria-current="page">Tutorial</a>
            <a href="../playground/playground.html">Playground</a>
            <a href="../pages/challenge.html">Challenges</a>
            <a href="../sandbox/sandbox.html">Sandbox</a>
            <a href="../home/home.html#faq">FAQ</a>
            <a href="../home/home.html#feedback">Feedback</a>
        </nav>

    </header>

    <div class="tutorial-container">

        <!--
            The JavaScript builds the complete roadmap dynamically.
            Keeping the list empty here prevents duplicated lesson
            definitions and makes future additions data-driven.
        -->
        <aside class="tutorial-sidebar">
            <h2>📚 SQL Roadmap</h2>

            <p style="color:#94a3b8; line-height:1.5;">
                Start with RDBMS fundamentals, then move from Beginner
                to Intermediate, Expert and finally Interview practice.
            </p>

            <ul></ul>
        </aside>

        <!-- tutorial.js renders the active lesson here. -->
        <main class="tutorial-content"></main>

    </div>

    <!-- ============================================================
         BROWSER SQL PRACTICE ENGINE
         ------------------------------------------------------------
         Tutorial practice uses the same browser-first SQLite approach
         as the existing Challenge/Playground architecture.
         ============================================================ -->

    <script src="../services/sqliteWasmLoader.js?v=1"></script>
    <script src="../services/browserSqlEngine.js?v=6"></script>
    <script src="../services/sqlEngine.js?v=4"></script>

    <!-- Tutorial-specific application logic. -->
    <script src="tutorial.js?v=5"></script>

</body>
</html>
