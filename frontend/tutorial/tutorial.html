<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SQL Tutorials | SQL Learning Platform</title>

    <!-- Shared platform styling. -->
    <link rel="stylesheet" href="../styles/main.css">

    <!-- Tutorial-only styling. Keep this file inside frontend/tutorial/. -->
    <link rel="stylesheet" href="tutorial.css">
</head>

<body>

<header class="tutorial-header">
    <div>
        <h1>SQL Learning Platform</h1>
        <p class="tutorial-header-subtitle">Learn SQL from fundamentals to real interview problems.</p>
    </div>

    <nav aria-label="Primary navigation">
        <a href="../pages/home.html">Home</a>
        <a href="tutorial.html" class="active">Tutorials</a>
        <a href="../playground/playground.html">Playground</a>
        <a href="../pages/challenge.html">Challenges</a>
        <a href="../pages/explorer.html">Explorer</a>
        <a href="../sandbox/sandbox.html">Sandbox</a>
    </nav>
</header>

<main class="tutorial-shell">

    <!-- ============================================================
         TUTORIAL SIDEBAR
         ------------------------------------------------------------
         Each learning track is collapsible. JavaScript keeps the
         currently selected track/lesson highlighted.
         ============================================================ -->
    <aside class="tutorial-sidebar" aria-label="SQL learning roadmap">

        <div class="roadmap-heading">
            <span>📚</span>
            <div>
                <h2>SQL Roadmap</h2>
                <p>Choose a track</p>
            </div>
        </div>

        <div id="tutorial-roadmap" class="tutorial-roadmap"></div>

    </aside>

    <!-- ============================================================
         LESSON CONTENT
         ------------------------------------------------------------
         tutorial.js dynamically renders the selected lesson here.
         ============================================================ -->
    <section class="tutorial-content" aria-live="polite">
        <div class="tutorial-loading">
            <div class="loading-spinner"></div>
            <p>Loading SQL tutorial...</p>
        </div>
    </section>

</main>

<!-- ================================================================
     SQL EXECUTION STACK
     ---------------------------------------------------------------
     The tutorial uses the same browser-first SQL architecture as
     Playground/Challenges. Results are generated in browser SQLite
     first, reducing backend load.

     IMPORTANT:
     These paths are correct for:
         frontend/tutorial/tutorial.html
     ================================================================= -->
<script src="../services/sqliteWasmLoader.js?v=1"></script>
<script src="../services/browserSqlEngine.js?v=6"></script>
<script src="../services/sqlEngine.js?v=4"></script>

<!-- Tutorial-specific logic must load after the SQL engine. -->
<script src="tutorial.js?v=3"></script>

</body>
</html>
