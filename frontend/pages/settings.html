<body>

    <header>

        <h1>SQL Learning Platform</h1>

        <nav>

            <a href="home.html">Home</a>

    <div class="settings-container">

        <h2>Settings</h2>

        <div class="setting-card">

            <label>

                <input type="checkbox" checked>

                Dark Mode

            </label>

        </div>

        <div class="setting-card">

            <label>

                <input type="checkbox" checked>

                Query Auto Suggestions

            </label>

        </div>

        <div class="setting-card">

            <label>

                <input type="checkbox" checked>

                Save Query History

            </label>

        </div>

        <div class="setting-card">

            <label>

                Font Size

            </label>

            <select>

                <option>Small</option>
                <option selected>Medium</option>
                <option>Large</option>

            </select>

        </div>

    </div>
