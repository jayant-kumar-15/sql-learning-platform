<!DOCTYPE html>

<html>

<head>

    <title>SQL Playground</title>

    <link rel="stylesheet" href="../styles/playground.css">

</head>

<body>

    <div class="container">

        <aside class="sidebar">

            <h2>SQL Learn</h2>

            <ul>

                <li>🏠 Home</li>
                <li>📘 Tutorials</li>
                <li>💻 Playground</li>
                <li>🗄️ Explorer</li>
                <li>🏆 Challenges</li>

            </ul>

        </aside>

        <main class="content">

            <h1>SQL Playground</h1>

            <textarea
                placeholder="Write your SQL query here...

SELECT * FROM PATIENTS;">
            </textarea>

            <button>Run Query</button>

            <div class="results">

                <h3>Results</h3>

                <table>

                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                    </tr>

                    <tr>
                        <td>1</td>
                        <td>John</td>
                        <td>25</td>
                    </tr>

                </table>

            </div>

        </main>

    </div>

</body>

</html>
